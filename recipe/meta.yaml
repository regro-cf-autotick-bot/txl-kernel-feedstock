{% set python_min = "3.10" %}
{% set name = "txl-kernel" %}
{% set version = "0.3.7" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/txl_kernel-{{ version }}.tar.gz
  sha256: 36f663683014c4005daf6a5d59827066db522619d205a7ab243efca955ca156b

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling
  run:
    - python >={{ python_min }}
    - txl =0.3.2
    - python-dateutil >=2.8.2
    - pycrdt >=0.10.9,<0.13.0

test:
  requires:
    - pip
    - python {{ python_min }}
  commands:
    - pip check
  imports:
    - txl_kernel

about:
  home: https://github.com/davidbrochart/jpterm/blob/main/plugins/kernel
  summary: TXL plugin for a kernel driver
  dev_url: https://github.com/davidbrochart/jpterm/blob/main/plugins/kernel
  license_file: LICENSE.txt
  license: MIT
  license_family: MIT

extra:
  recipe-maintainers:
    - davidbrochart
